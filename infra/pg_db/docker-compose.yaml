# pg_db — declarative definition (DRAFT for review, plan item 10)
# Replaces the hand-run `docker run` from 2026-06. Fixes, per audit:
#   SEC-05: password via root-only secret FILE — never in container metadata
#   DB-04:  healthcheck (memory guardrails deliberately deferred — see runbook)
#   SEC-06: TLS key relocated so host uid-999 (dd-agent) cannot traverse to it
#
# Home (decided 2026-08-18): pg_manage_v2/infra/pg_db/ — grouped with the other DB tooling.
# The externals below reuse the EXISTING volume/network — no data is touched.

name: pg-infra

services:
  pg_db:
    image: postgres:16
    container_name: pg_db            # apps resolve PGHOST=pg_db by this name
    restart: unless-stopped
    networks: [pg_net]
    ports:
      - "5432:5432"                  # NSG remains the boundary (SEC-11 note:
                                     # private-bind decision deferred, doc 2.1)
    # NO password variable here, deliberately (this is the SEC-05 fix).
    # postgres:16's entrypoint only requires POSTGRES_PASSWORD/_FILE when it is
    # INITIALIZING an empty data directory (docker_verify_minimum_env runs only
    # inside `if [ -z "$DATABASE_ALREADY_EXISTS" ]`). postgres_data is already
    # initialized, so the value would be read by nothing while still showing up
    # in `docker inspect`. The role password lives in the DB catalog; rotate it
    # with `\password`, never here.
    #
    # BUILDING A NEW SERVER (empty volume)? Initialization DOES need it. Create
    # a root-only file first, then uncomment these two lines and the `secrets:`
    # block at the bottom:
    #   sudo install -m 600 -o root -g root /dev/null /root/pg_superuser_pw
    #   # write the intended superuser password into it, one line, no newline
    # environment:
    #   POSTGRES_PASSWORD_FILE: /run/secrets/pg_pw
    # secrets:
    #   - pg_pw
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Long-form binds with create_host_path:false — on a host where the cert or
      # key is missing (new server, wrong path), `up` fails with a clear error
      # instead of Docker silently creating an empty DIRECTORY at the source path
      # and postgres crash-looping on it (REL-09 class trap).
      - type: bind
        source: /opt/resources/ssl/pg_ssl.crt
        target: /etc/ssl/pg_ssl.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/resources/ssl/private/pg_ssl.key
        target: /etc/ssl/pg_ssl.key
        read_only: true
        bind:
          create_host_path: false
    # Cap container log growth (audit OPS-02): json-file grows unbounded by
    # default. Applied per-service in tracked compose (not daemon.json) so a
    # rebuilt server gets it for free. Takes effect at next recreate.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: >
      -c ssl=on
      -c ssl_cert_file=/etc/ssl/pg_ssl.crt
      -c ssl_key_file=/etc/ssl/pg_ssl.key
      -c shared_preload_libraries=pg_stat_statements
    healthcheck:
      # No -d <db>: the app database name is per-server (dev/staging/prod), and
      # pg_isready against the default maintenance DB proves readiness anywhere.
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Memory limits: NOT set in this draft on purpose. DB-04 says size from
    # observed peaks, and the June OOM is still uninvestigated. Add a
    # deploy.resources.limits block only after a measurement pass.

networks:
  pg_net:
    external: true                   # existing network, apps already attached

volumes:
  postgres_data:
    external: true                   # EXISTING data volume — reused, not created

# Only needed when initializing an EMPTY volume (new server). See the note on
# the service above; leave commented on a server whose database already exists.
# secrets:
#   pg_pw:
#     file: /root/pg_superuser_pw    # root-owned 0600
